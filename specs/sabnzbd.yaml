app_id: sabnzbddocker
title: SABnzbd
image: linuxserver/sabnzbd:5.1.3
repo_name: sabnzbd
mode: wrapper
entrypoint_file: src/entrypoint.sh
wrapper_note: 'the upstream image boots with the s6-overlay v3 init, whose service manager

  runs as root and drops to the "abc" user; with user "1000:1000" it cannot

  start sabnzbd and nothing listens on 8080. TOS forbids root containers, so

  src/entrypoint.sh runs exactly the command the s6 service runs, directly as

  the unprivileged container user.

  '
wrapper_note_readme: '- **Entrypoint wrapper** (not a privilege shim): the s6 service manager of the image
  needs root, so `src/entrypoint.sh` starts SABnzbd directly as the unprivileged container user.'
user_mode_text: 上游镜像以 s6 管理服务且需要 root，入口包装改为直接以 uid 1000 运行 SABnzbd
user_mode_cons: "- 上游镜像用 s6-overlay v3 管理服务，`user: \"1000:1000\"` 时 s6 无法启动 sabnzbd，\n  容器 Up 但 8080 无人监听。因此\
  \ `src/entrypoint.sh` 直接执行镜像自带的同一条命令。\n- SABnzbd 自身不需要 root：配置、下载、日志都在挂载卷内，实测非 root 下首页 200。\n"
container_port: 8080
platform: x86_64
platforms:
- x86_64
- aarch64
category:
- Download
user: 1000:1000
volumes:
- host: /Volume1/DockerAppData/sabnzbddocker/config
  container: /config
- host: /Volume1/DockerAppData/sabnzbddocker/downloads
  container: /downloads
env:
  TZ: Asia/Shanghai
healthcheck:
- CMD-SHELL
- curl -s -o /dev/null http://127.0.0.1:8080/ || exit 1
healthcheck_interval: 30s
healthcheck_timeout: 10s
healthcheck_retries: 5
healthcheck_start_period: 90s
healthcheck_note: 探测首页 `/`，SABnzbd 能应答即健康（首次启动要生成 sabnzbd.ini，90s 宽限）。
auth: SABnzbd
upstream_url: https://github.com/sabnzbd/sabnzbd
upstream_license: GPL-2.0
license: GPL-2.0
official: https://github.com/sabnzbd/sabnzbd
help: https://github.com/Moechz/sabnzbd/issues
upstream_version: 5.1.3
version: 5.1.3-1
descript: SABnzbd is a Usenet downloader. Give it an NZB file or a search result and it downloads, verifies
  and repairs the files with PAR2, then unpacks them into your download folder - all from a clean web
  interface. This package runs the LinuxServer.io Docker image as a non-root container and keeps the configuration,
  database, logs and finished downloads in the application data folder.
important: 'Requires DockerEngine (installed if missing); add a registry mirror if Docker Hub is unreachable.
  Open the app and add your Usenet provider, optionally an indexer. Configuration and downloads live in
  the application data folder - back it up before uninstalling with data removal. TOS Docker applications
  cannot see shared folders: move finished downloads out with File Manager, or edit docker-compose.yml
  to mount your share.'
release_note: '1. First release: SABnzbd 5.1.3 from the LinuxServer.io Docker Hub image, running as a
  non-root container. Configuration, logs and downloads are kept in the application data folder.'
data_notes: '`config/` holds `sabnzbd.ini` (server, provider, folders, categories), the download history
  database, logs and cache; `downloads/` receives the finished files (incomplete downloads go to `downloads/incomplete`
  by default). Copying the `sabnzbddocker` folder is a complete backup.'
design_notes:
- '**Non-root by construction.** The s6 service manager of the image runs as root, so the wrapper starts
  SABnzbd directly as `1000:1000`; verified on real hardware with `id` inside the container.'
- '**Fixed image tag `5.1.3`**, Docker Hub only, no `privileged`, no `network_mode: host`, no `cap_add`,
  no Docker socket.'
- '**Health check** on the UI itself (`GET /` on port 8080) with a 90 s start period for the first start.'
limitations:
- 'TOS Docker applications cannot mount shared folders: finished downloads stay in `/Volume1/DockerAppData/sabnzbddocker/downloads/`.
  Move them to your media share with File Manager, or edit `/Volume1/@apps/DockerEngine/application/sabnzbddocker/docker-compose.yml`
  after installation to mount a share.'
- A Usenet provider account is required; indexers and the *arr integration are optional and configured
  in the web UI.
- The UI is served over plain HTTP on the LAN. Do not expose the published port to the internet without
  a TLS reverse proxy.
runtime_files:
- path: config/sabnzbd.ini
  purpose: all settings - Usenet servers, folders, categories, API key, web UI options
  created: first start
  growth: static, rewritten on every settings change
  lifecycle: never overwritten by the app; it is the whole configuration
- path: config/logs
  purpose: SABnzbd log files
  created: first start
  growth: rotated by SABnzbd
  lifecycle: safe to delete
- path: config/admin
  purpose: web UI cache and the .rss/.nzb admin area
  created: first start
  growth: small
  lifecycle: safe to delete
- path: config/Downloads
  purpose: default complete-download folder (SABnzbd's default is relative to the config directory)
  created: first start
  growth: grows with every download until you move the files out
  lifecycle: managed by SABnzbd and by you
- path: downloads
  purpose: the /downloads volume - set it as the complete folder in the web UI to keep downloads there
  created: first start (empty)
  growth: grows with every download
  lifecycle: managed by you
translations:
  zh-cn:
    descript: SABnzbd 是 Usenet 下载器：给它一个 NZB 或搜索结果，它会下载、用 PAR2 校验修复、再解压到下载目录，全部在干净的网页界面里完成。本应用以非 root 容器运行
      LinuxServer.io 的镜像，配置、数据库、日志与下载文件都保存在应用数据目录中。
    important: 需要 DockerEngine（缺失时应用中心会提示安装）。镜像安装时从 Docker Hub 拉取，无法直连请先配置镜像加速。打开后填写 Usenet 服务商，可选填索引站或
      *arr 集成。下载与配置都在应用数据目录，卸载并删除数据前请先备份。与其他 TOS Docker 应用一样访问不到共享文件夹：用文件管理器把完成的文件移出 DockerAppData/sabnzbddocker/downloads，或编辑
      docker-compose.yml 挂载自己的共享目录。
    release_note: 1. 首次发布：来自 LinuxServer.io Docker Hub 镜像的 SABnzbd 5.1.3，以非 root 容器运行；配置、日志与下载保存在应用数据目录。
  zh-hk:
    descript: SABnzbd 是 Usenet 下載器：給它一個 NZB 或搜尋結果，它會下載、用 PAR2 校驗修復、再解壓到下载目錄，全部在乾淨的網頁介面裡完成。本應用以非 root 容器執行
      LinuxServer.io 的映像，設定、資料庫、日誌與下載檔案都保存在應用資料目錄中。
    important: 需要 DockerEngine（缺少時應用中心會提示安裝）。映像安裝時從 Docker Hub 下載，無法直連請先設定映像加速。開啟後填寫 Usenet 服務商，可選填索引站或
      *arr 整合。下載與設定都在應用資料目錄，解除安裝並刪除資料前請先備份。與其他 TOS Docker 應用一樣存取不到共享資料夾：用檔案管理器把完成的檔案移出 DockerAppData/sabnzbddocker/downloads，或編輯
      docker-compose.yml 掛載自己的共享目錄。
    release_note: 1. 首次發佈：來自 LinuxServer.io Docker Hub 映像的 SABnzbd 5.1.3，以非 root 容器執行；設定、日誌與下載保存在應用資料目錄。
